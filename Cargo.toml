[package]
name = "dioxus-file-explorer"
edition = "2024"
version = "0.1.0"

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.0-rc.0", features = ["desktop"] }
# dioxus-free-icons = { git = "https://github.com/elwerene/dioxus-free-icons", rev = "12048cf" }
open = { version = "5.3.2" }
chrono = { version = "0.4", features = ["clock", "std"] }
walkdir = "2"
humansize = "2"
rfd = { version = "0.15.4", default-features = false, features = ["tokio"] } # native file/folder dialogs - use only tokio features
csv = "1"
once_cell = "1"
rayon = "1.11.0"
crossbeam = "0.8.4"
tokio = { version = "1.47.1", features = ["full"] }
image = { version = "0.25.6", features = ["serde"] }
base64 = "0.22"
blake3 = "1.5"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
surrealdb = { version = "2.3.7", features = ["kv-mem", "kv-surrealkv"] }
kalosm = { git = "https://github.com/floneum/floneum", branch = "main", features = ["language", "vision", "surrealdb", "openai"] } # , "cuda" version = "0.4.0",
async-trait = "0.1"
rand = { version = "0.9.2" }
anyhow = {  version = "1" }
fastembed = { version = "5.1.0" }
ort = { version = "2.0.0-rc.10", features = ["cuda"] }

[patch.crates-io]
# Point both crates to the same source so there can't be duplicates.
ort = { git = "https://github.com/pykeio/ort", rev = "f7f57117" }
ort-sys = { git = "https://github.com/pykeio/ort", rev = "f7f57117" }

# Keep windows features for Windows-specific functionality
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
	"Win32_UI_Shell",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_Storage_FileSystem",
    "UI",
    "UI_Shell"
] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
