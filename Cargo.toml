[package]
name = "dioxus-file-explorer"
edition = "2024"
version = "0.1.0"

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.0-rc.0", features = ["desktop"] }
# dioxus-free-icons = { git = "https://github.com/elwerene/dioxus-free-icons", rev = "12048cf" }
open = { version = "5.3.2" }
chrono = { version = "0.4", features = ["clock", "std"] }
walkdir = "2"
humansize = "2"
rfd = { version = "0.15.4", default-features = false, features = ["tokio"] } # native file/folder dialogs - use only tokio features
csv = "1"
once_cell = "1"
rayon = "1.11.0"
crossbeam = "0.8.4"
tokio = { version = "1.47.1", features = ["full"] }
image = { version = "0.25.6", features = ["serde"] }
base64 = "0.22"
blake3 = "1.5"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
surrealdb = { version = "2.3.7", features = ["kv-mem", "kv-surrealkv"] }
async-trait = "0.1"
anyhow = {  version = "1" }
regex = "1.11.2"
kalosm = { git = "https://github.com/floneum/floneum", branch = "main", features = ["language", "vision", "surrealdb", "openai"] } # , "" version = "0.4.0", , "cuda"

# Optional (feature-gated) dependencies for the JoyCaption Candle-based LLaVA adapter.
# These are only compiled when the `joycaption` feature is enabled to keep normal builds light.
candle-core = { version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true }
candle-examples = { version = "0.9.1", optional = true}
tokenizers = { version = "0.22.0", optional = true, features = ["http"] }
hf-hub = { version = "0.4.3", optional = true }
serde_path_to_error = { version = "0.1.17", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
futures-core = { version = "0.3", optional = true }

[features]
default = ["joycaption"]
cuda = ["kalosm/cuda"]

joycaption = [
	"candle-core/cuda",
	"candle-nn/cuda",
	"candle-transformers/cuda",
	"candle-examples/cuda",
	"tokenizers",
	"hf-hub",
	"serde_path_to_error",
	"tracing",
	"futures-core",
]

# Keep windows features for Windows-specific functionality
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
	"Win32_UI_Shell",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_Storage_FileSystem",
    "UI",
    "UI_Shell"
] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
