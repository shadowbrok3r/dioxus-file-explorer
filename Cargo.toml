[package]
name = "dioxus-file-explorer"
edition = "2024"
version = "0.1.0"

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", tag = "v0.7.0-rc.0", features = ["desktop"] }
# dioxus-free-icons = { git = "https://github.com/elwerene/dioxus-free-icons", rev = "12048cf" }
open = { version = "5.3.2" }
chrono = { version = "0.4", features = ["clock", "std"] }
walkdir = "2"
humansize = "2"
rfd = { version = "0.15.4", default-features = false, features = ["tokio"] } # native file/folder dialogs - use only tokio features
csv = "1"
once_cell = "1"
rayon = "1.11.0"
crossbeam = "0.8.4"
tokio = { version = "1.47.1", features = ["full"] }
image = { version = "0.25.6", features = ["serde"] }
base64 = "0.22"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# AI and database dependencies for smart search
surrealdb = { version = "1.5", features = ["kv-mem"] }
# TODO: Add back AI dependencies after getting basic build working  
# surrealdb = { version = "1.5", features = ["kv-mem"] }
# Keep windows features for Windows-specific functionality
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
	"Win32_UI_Shell",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_Storage_FileSystem",
    "UI",
    "UI_Shell"
] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
